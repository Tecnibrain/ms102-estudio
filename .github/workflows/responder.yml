name: Responder comandos MD-102

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 min (gratis e ilimitado en repos públicos)
  workflow_dispatch:

permissions:
  contents: write            # para guardar el progreso (bot/state.json)

concurrency:
  group: bot-state           # evita choques con el reto diario
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot/requirements.txt
      - name: Atender comandos y respuestas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: python bot/responder.py
      - name: Guardar progreso
        run: |
          if ! git diff --quiet bot/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bot/state.json bot/config.json 2>/dev/null || true
            git commit -m "bot: actualiza progreso" || exit 0
            git pull --rebase --autostash origin main || true
            git push
          fi
