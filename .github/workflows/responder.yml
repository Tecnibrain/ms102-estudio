name: Responder comandos MD-102

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 min (gratis e ilimitado en repos públicos)
  workflow_dispatch:

permissions:
  contents: write            # para guardar cambios de /cantidad

concurrency:
  group: responder           # evita solapes entre corridas
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot/requirements.txt
      - name: Atender comandos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: python bot/responder.py
      - name: Guardar config si cambió
        run: |
          if ! git diff --quiet bot/config.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bot/config.json
            git commit -m "Actualiza cantidad diaria vía /cantidad"
            git push
          fi
