name: Reto diario MD-102

on:
  schedule:
    # 13:00 UTC = 8:00 a.m. en Colombia (UTC-5). Ajusta si cambias de zona horaria.
    - cron: '0 13 * * *'
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot/requirements.txt
      - name: Enviar reto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_COUNT: '3'
          WEB_URL: ${{ vars.WEB_URL }}
        run: python bot/send_daily.py
