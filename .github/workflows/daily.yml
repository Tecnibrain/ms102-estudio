name: Reto diario MD-102

on:
  schedule:
    # 13:00 UTC = 8:00 a.m. en Colombia (UTC-5). Ajusta si cambias de zona horaria.
    - cron: '0 13 * * *'
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write           # para guardar la racha y las encuestas enviadas

concurrency:
  group: bot-state          # evita choques con el responder
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot/requirements.txt
      - name: Enviar reto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_COUNT: '3'
          WEB_URL: ${{ vars.WEB_URL }}
        run: python bot/send_daily.py
      - name: Guardar estado
        run: |
          if ! git diff --quiet bot/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bot/state.json
            git commit -m "bot: racha y encuestas del dia" || exit 0
            git pull --rebase --autostash origin main || true
            git push
          fi
